name: audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Verify formatting, audit, typechecks, and all offline tests
        run: make verify

      - name: Smoke install full profile into a disposable HOME
        run: ./scripts/smoke.sh
