name: audit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run secret/private-file audit
        run: ./scripts/audit.sh

      - name: Verify formatting
        run: bun x prettier --check .

      - name: Verify extensions (install, type-check, test)
        run: make install
        env:
          # Suppress bun postinstall trust prompts in CI.
          BUN_CONFIG_AUTO_INSTALL: never

  verify-extensions:
    runs-on: ubuntu-latest
    needs: audit
    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: make install

      - name: Type-check + test each extension
        run: |
          for d in files/extensions/*/; do
            n=$(basename "$d")
            [ "$n" = "_shared" ] && continue
            if [ -f "$d/package.json" ]; then
              echo "::group::$n"
              (cd "$d" && bun run check && bun test)
              echo "::endgroup::"
            fi
          done
